# Diffusion-MoD configuration for MVBench.
model:
  arch: blip2_vicuna_instruct
  model_type: vicuna7b
  load_finetuned: False
  load_pretrained: True
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp32"
  freeze_vit: False
  num_query_token: 32
  llm_model: "llm/vicuna-7b"
  prompt: ""
  temporal_layers: 2
  mod_keep_ratio: 0.5
  mod_expansion: 2
  mod_dropout: 0.1
  lambda_mod: 0.01
  lambda_dsf: 1.0
  dsf_steps: 20
  dsf_init_noise: 0.1
  dsf_target_temp: 0.07
datasets:
  mvbench_qa:
    vis_processor:
      train:
        name: "blip2_video_train"
        image_size: 224
      eval:
        name: "blip2_video_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_question"
        prompt: "Question: {} Short answer:"
        max_words: 200
      eval:
        name: "blip_question"
        prompt: ""
        max_words: 200
    num_frames: 16

run:
  task: vqa
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 8
  accum_grad_iters: 1
  max_len: 20
  min_len: 1
  num_beams: 5
  inference_method: "generate"
  prompt: "Question: {} Short answer:"
  seed: 42
  output_dir: "output/mvbench"
  amp: True
  resume_ckpt_path: null
  evaluate: True
  train_splits: []
  valid_splits: []
  test_splits: ["test"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  report_metric: True
  suffix: null
